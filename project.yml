name: AudioToTextOnMobile
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  AudioToTextOnMobile:
    type: application
    platform: iOS
    sources:
      - path: AudioToTextOnMobile
      - path: Shared
    dependencies:
      - target: AudioToTextKeyboard
        embed: true
    entitlements:
      path: AudioToTextOnMobile/AudioToTextOnMobile.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.example.AudioToTextOnMobile
    info:
      path: AudioToTextOnMobile/Info.plist
      properties:
        CFBundleDisplayName: "Audio To Text"
        NSMicrophoneUsageDescription: "This app uses the microphone to capture your speech and transcribe it to text in real time."
        NSSpeechRecognitionUsageDescription: "Speech recognition converts your spoken words into text. Everything runs locally on your device — no audio is uploaded."
        CFBundleURLTypes:
          - CFBundleURLName: com.example.AudioToTextOnMobile
            CFBundleURLSchemes:
              - attotext
        UIBackgroundModes:
          - audio
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.AudioToTextOnMobile
        PRODUCT_NAME: AudioToTextOnMobile
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 57KNZSYU47
        ENABLE_PREVIEWS: YES
        SUPPORTS_MACCATALYST: NO
        SWIFT_OBJC_BRIDGING_HEADER: Shared/Shared-Bridging-Header.h

  AudioToTextKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - path: AudioToTextKeyboard
      - path: Shared
    entitlements:
      path: AudioToTextKeyboard/AudioToTextKeyboard.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.example.AudioToTextOnMobile
    info:
      path: AudioToTextKeyboard/Info.plist
      properties:
        CFBundleDisplayName: "Audio To Text"
        NSMicrophoneUsageDescription: "The keyboard uses the microphone to capture your speech and transcribe it to text. Requires Full Access."
        NSSpeechRecognitionUsageDescription: "Speech recognition converts your spoken words into text. Everything runs locally on your device — no audio is uploaded."
        NSExtension:
          NSExtensionAttributes:
            RequestsOpenAccess: true
            PrimaryLanguage: en-US
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.AudioToTextOnMobile.Keyboard
        PRODUCT_NAME: AudioToTextKeyboard
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 57KNZSYU47
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        ENABLE_PREVIEWS: YES
        SWIFT_OBJC_BRIDGING_HEADER: Shared/Shared-Bridging-Header.h

schemes:
  AudioToTextOnMobile:
    build:
      targets:
        AudioToTextOnMobile: all
  AudioToTextKeyboard:
    build:
      targets:
        AudioToTextKeyboard: all
